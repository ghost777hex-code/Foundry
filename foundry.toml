[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
test = "test"
script = "script"
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false
fs_permissions = [{ access = "read", path = "./" }]
gas_reports = ["*"]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = false

# Heavier settings for CI: `FOUNDRY_PROFILE=ci forge test`
[profile.ci.fuzz]
runs = 10_000

[profile.ci.invariant]
runs = 256
depth = 64

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
sort_imports = true

# Aliases for --rpc-url and vm.createSelectFork("<alias>")
[rpc_endpoints]
# Fork tests (test/fork/). Public node without archive state: only recent blocks can be forked.
mainnet = "https://ethereum-rpc.publicnode.com"
localhost = "http://127.0.0.1:8545"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
